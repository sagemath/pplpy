[build-system]
requires = [
    "meson-python>=0.15",
    "meson>=1.3.0",
    "Cython",
    "cysignals",
    "gmpy2>=2.2.0",
]
build-backend = "mesonpy"

[tool.meson-python.args]
setup = ['--default-library=static']
install = ['--skip-subprojects']

[project]
name = "pplpy"
description = "Python PPL wrapper"
readme = "README.rst"
authors = [{name = "Vincent Delecroix", email = "vincent.delecroix@labri.fr"}]
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Unix",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "polyhedron",
    "polytope",
    "convex",
    "mathematics",
    "ppl",
    "milp",
    "linear-programming",
]
dependencies = [
    "cysignals",
    "gmpy2>=2.2.0",
]

dynamic = ["version"]

[project.optional-dependencies]
doc = [
    "sphinx",
]

[project.urls]
Homepage = "https://github.com/sagemath/pplpy"
Download = "https://pypi.org/project/pplpy/#files"

[tool.pytest.ini_options]
testpaths = ["tests", "ppl"]
doctest_optionflags = "ELLIPSIS NORMALIZE_WHITESPACE"
addopts = "--doctest-report=ndiff --import-mode=importlib"

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-* cp314t-*"
enable = ["cpython-freethreading"]
build-frontend = "build"
test-requires = ["pytest"]
test-command = "pytest {project}/tests {project}/ppl"

[tool.cibuildwheel.linux]
before-all = '''
(command -v apk > /dev/null && apk add --no-cache m4 g++ || true) &&
cd /tmp &&
curl -fL https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz | tar xJ &&
cd gmp-6.3.0 &&
./configure --disable-shared --enable-static --enable-cxx --with-pic --prefix=/usr/local CFLAGS='-O2 -g0' CXXFLAGS='-O2 -g0' &&
make -j$(nproc) &&
make install &&
cd /tmp &&
curl -fL https://ftp.gnu.org/gnu/glpk/glpk-5.0.tar.gz | tar xz &&
cd glpk-5.0 &&
./configure --disable-shared --enable-static --with-pic --prefix=/usr/local CFLAGS='-O2 -g0' &&
make -j$(nproc) &&
make install
'''
repair-wheel-command = "auditwheel repair --strip -w {dest_dir} {wheel}"

[tool.cibuildwheel.linux.environment]
LIBRARY_PATH = "/usr/local/lib:$LIBRARY_PATH"
CPATH = "/usr/local/include:$CPATH"
PKG_CONFIG_PATH = "/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"

[tool.cibuildwheel.macos]
before-all = '''
brew install gmp glpk &&
rm -f $(brew --prefix gmp)/lib/libgmp*.dylib $(brew --prefix gmp)/lib/libgmpxx*.dylib &&
rm -f $(brew --prefix glpk)/lib/libglpk*.dylib
'''
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.environments]
default = ["py314"]
py312 = ["py312"]
py313 = ["py313"]
doc = ["doc"]
lint = ["lint"]

[tool.pixi.dependencies]
python = ">=3.12,<3.15"
cxx-compiler = "*"
pkg-config = "*"
meson = ">=1.3.0"
meson-python = ">=0.15"
ninja = "*"
cython = "*"
cysignals = "*"
gmpy2 = ">=2.2.0"
gmp = "*"
ppl = "*"
pip = "*"
pytest = "*"

[tool.pixi.pypi-dependencies]
pplpy = { path = ".", editable = true }

[tool.pixi.pypi-options]
no-build-isolation = ["pplpy"]

[tool.pixi.tasks]
test = { depends-on = ["test-pytest", "test-examples"] }
test-pytest = "pytest"
test-examples = "meson setup --reconfigure build/examples && meson test -C build/examples"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.lint.dependencies]
cython-lint = "*"

[tool.pixi.feature.lint.tasks]
lint = "cython-lint --ignore=E265,E266,E501,E741 --exclude='ppl_decl.pxd' ppl/"

[tool.pixi.feature.doc.dependencies]
sphinx = "*"
linkchecker = "*"

[tool.pixi.feature.doc.tasks]
doc = "sphinx-build docs/source html/pplpy"
linkcheck = { cmd = "linkchecker --check-extern --ignore-url='_modules/|https://www.sphinx-doc.org/' html/pplpy/index.html", depends-on = ["doc"] }
